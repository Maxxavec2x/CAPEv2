[project]
name = "CAPEv2"
version = "0.1.0"
description = "CAPE: Malware Configuration And Payload Extraction"
authors = [
    { name = "Kevin O'Reilly", email = "kev@capesandbox.com" },
    { name = "doomedraven", email = "doomedraven@capesandbox.com" },
]
license = { text = "MIT" }
requires-python = ">=3.10, <4.0"
dependencies = [
    "alembic==1.9.4",
    "gevent==24.2.1",
    "greenlet==3.0.3",
    "Pebble==5.1.0",
    "cryptography>=44.0.1",
    "requests[security,socks]==2.32.4",
    "pefile",
    "tldextract>=5.1.2",
    "oletools==0.60.2",
    "olefile==0.47",
    "capstone==5.0.5",
    "pycryptodomex>=3.20.0",
    "requests-file>=1.5.1",
    "orjson>=3.9.15",
    "SFlock2[linux,shellcode]>=0.3.76",
    "pyzipper==0.3.6",
    "flare-capa==9.3.1",
    "Cython==3.0.11",
    "Django>=4.2.18",
    "SQLAlchemy==2.0.41",
    "SQLAlchemy-Utils==0.41.1",
    "Jinja2>=3.1.6",
    "chardet==4.0.0",
    "pygal==2.4.0",
    "dpkt==1.9.6",
    "dnspython==2.7.0",
    "pytz==2021.1",
    "maxminddb==2.6.3",
    "Pillow>=8.2.0",
    "python-whois==0.9.5",
    "bs4==0.0.1",
    "pydeep2==0.5.1",
    "django-recaptcha==4.0.0",
    "django-crispy-forms==2.3",
    "crispy-bootstrap4==2024.10",
    "django-settings-export==1.2.1",
    "django-csp==3.8",
    "django-extensions==3.2.3",
    "django-ratelimit==4.1.0",
    "python-tlsh==4.5.0",
    "djangorestframework==3.15.2",
    "yara-python==4.5.1",
    "pymongo>=4.0.1",
    "LnkParse3==1.5.0",
    "cachetools>=5.5.1",
    "django-allauth==65.13.0",
    "psycopg2-binary>=2.9.10",
    "ruff>=0.7.2",
    "paramiko==3.5.0",
    "psutil==6.1.1",
    "pyre2>=0.3.10",
    "Werkzeug==3.1.5",
    "packaging==24.2",
    "setuptools==78.1.1",
    "crudini==0.9.5",
    "python-dateutil==2.9.0.post0",
    "python-msi>=0.0.0a3",
    "pyguacamole>=0.11",
    "uvicorn[standard]>=0.18.2",
    "gunicorn>=23.0.0",
    "channels[daphne]>=4.0.0",
    "setproctitle==1.3.2",
    "CAPE-parsers>=0.1.36",
    "maco==1.1.8",
    "libvirt-python>=12.7.0",
    "volatility3>=2.28.2",
]

[project.optional-dependencies]
maco = ["maco"]
gcp = ["google-cloud-storage", "google-cloud-pubsub"]
yara = ["plyara"]
mcp = ["fastmcp", "httpx"]

[dependency-groups]
dev = [
    "black>=24.3.0",
    "isort>=5.10.1",
    "mypy==1.14.1",
    "pytest==7.2.2",
    "pytest-pretty==1.1.0",
    "pytest-cov==3.0.0",
    "pytest-mock==3.7.0",
    "pytest-django==4.5.2",
    "pytest-asyncio==0.18.3",
    "pytest-xdist==3.6.1",
    "pytest-freezer==0.4.8",
    "tenacity==8.1.0",
    "types-requests>=2.32",
    "httpretty>=1.1.4",
    "func-timeout>=4.3.5",
    "pre-commit>=2.19.0",
]

[tool.poetry]
package-mode = true
name = "capev2"
version = "0.1.0"

[tool.uv]
package = false

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.uv.extra-build-dependencies]
"bs4-0.0.1" = ["setuptools"]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
alembic = "==1.9.4"
gevent = "==24.2.1"
greenlet = "==3.0.3"
Pebble = "==5.1.0"
cryptography = ">=44.0.1"
requests = { version = "==2.32.4", extras = ["security", "socks"] }
